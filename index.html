<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOI4 Prototype — January 1936</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar"></header>
    <div class="game-area">
      <div class="map-wrap">
        <canvas id="map" width="1200" height="900"></canvas>
      </div>
      <aside id="command-drawer" class="command-drawer collapsed">
        <button type="button" id="drawer-handle" class="drawer-handle" aria-expanded="false">Command ▲</button>
        <div id="command-body" class="drawer-body"></div>
      </aside>
    </div>
    <div id="gov-modal" class="modal hidden" role="dialog" aria-label="Government">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-content modal-gov">
        <header class="modal-header">
          <h2>Government</h2>
          <button type="button" class="modal-close" data-close aria-label="Close">×</button>
        </header>
        <div id="gov-body" class="modal-body"></div>
      </div>
    </div>
    <div id="focus-modal" class="modal hidden" role="dialog" aria-label="National Focuses">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-content modal-focus">
        <header class="modal-header">
          <h2>National Focuses</h2>
          <button type="button" class="modal-close" data-close aria-label="Close">×</button>
        </header>
        <div id="focus-body" class="modal-body"></div>
      </div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <div id="overlay" class="overlay hidden">
      <div class="overlay-card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-msg"></p>
        <button id="overlay-restart">Restart</button>
      </div>
    </div>
    <div id="start-screen" class="overlay">
      <div class="overlay-card start-card wide">
        <h1>HOI4 Prototype</h1>
        <p class="subtitle">January 1936 — The Gathering Storm</p>
        <p class="order-hint">Select your nation. ★ = full national focus tree.</p>
        <div id="nation-picks" class="nation-picks"></div>
        <ul class="feature-list">
          <li>Full-screen map — labels on hover only</li>
          <li>Command drawer, Government & Focus modals</li>
          <li>38 provinces, 20 nations, focus trees</li>
        </ul>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
